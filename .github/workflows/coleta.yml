name: Coleta e publicação

on:
  schedule:
    - cron: "17 9 * * 1,4" # segundas e quintas, 06h17 de São Paulo
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "coletor/**"
      - "site/**"
      - "dados/enriquecimento.json"
      - "dados/manual.json"
      - ".github/workflows/coleta.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Decidir se coleta
        id: decidir
        run: |
          coletar=sim
          if [ "${{ github.event_name }}" = "push" ]; then
            # push que só mexe em dados/ ou site/ (ex.: revisão semanal) apenas republica a página
            if ! git diff --name-only HEAD~1 HEAD | grep -qvE '^(dados|site)/'; then coletar=nao; fi
            if [ ! -f dados/concursos.json ]; then coletar=sim; fi
          fi
          echo "coletar=$coletar" >> "$GITHUB_OUTPUT"
      - name: Coletar fontes
        if: steps.decidir.outputs.coletar == 'sim'
        run: python -m coletor.main
      - name: Gravar dados no repositório
        if: steps.decidir.outputs.coletar == 'sim'
        run: |
          git config user.name "concursos-sp-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados
          if ! git diff --cached --quiet; then
            git commit -m "Coleta de $(TZ=America/Sao_Paulo date +%d/%m/%Y\ %H:%M)"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
      - name: Montar a página
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp -r dados _site/dados
          rm -f _site/dados/cache_detalhes.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicar:
    needs: coletar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
