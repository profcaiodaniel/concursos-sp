name: Sondagem de fontes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "probe/**"
      - ".github/workflows/sondagem.yml"

permissions:
  contents: write

concurrency:
  group: sondagem
  cancel-in-progress: true

jobs:
  sondagem:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Rodar sondagem
        run: python probe/probe2.py
      - name: Publicar resultados no branch probe-data
        if: always()
        run: |
          git config user.name "concursos-sp-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan probe-data
          git rm -rf --cached . > /dev/null
          git add -f probe_out
          git commit -m "Resultados da sondagem $(date -u +%FT%TZ)"
          git push -f origin probe-data
